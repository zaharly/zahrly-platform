name: archive-s3-e2e

on:
  push:
    paths:
      - '.github/workflows/archive-e2e.yml'
      - 'workers/archive_worker/**'
      - 'docker/Dockerfile.runtime'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHIVE_CAMPAIGN_ID: 74a52118-bffd-4438-9ddd-757928e094d4

jobs:
  archive-s3-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build archive worker image
        run: docker build -f docker/Dockerfile.runtime -t zahrly-archive-worker:e2e .

      - name: Run archive worker against test campaign
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "missing GitHub secret: $v"; exit 1; }
          done
          docker run --rm \
            -e SUPABASE_DB_URL \
            -e S3_ENDPOINT_URL \
            -e S3_REGION \
            -e S3_BUCKET \
            -e S3_PREFIX \
            -e S3_ACCESS_KEY_ID \
            -e S3_SECRET_ACCESS_KEY \
            zahrly-archive-worker:e2e \
            python -m workers.archive_worker.worker | tee archive_result.json

      - name: Verify campaign, manifest and S3 object
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import boto3
          import psycopg
          from psycopg.rows import dict_row

          result = json.load(open('archive_result.json', encoding='utf-8'))
          assert result.get('processed') is True, result
          assert result.get('status') == 'SUCCEEDED', result
          assert result.get('manifest_id'), result
          assert result.get('checksum') and len(result['checksum']) == 64, result
          assert result.get('object_uri', '').startswith('s3://'), result

          with psycopg.connect(os.environ['SUPABASE_DB_URL'], row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute('''
                    select c.status,c.object_uri,c.checksum,c.row_count,c.manifest_id,
                           cat.object_uri as catalog_object_uri,cat.checksum as catalog_checksum,
                           cat.row_count as catalog_row_count
                    from internal.archive_campaigns c
                    left join internal.archive_catalog cat on cat.manifest_id=c.manifest_id
                    where c.campaign_id=%s
                  ''', (os.environ['ARCHIVE_CAMPAIGN_ID'],))
                  row = cur.fetchone()
          assert row and row['status'] == 'SUCCEEDED', row
          assert row['object_uri'] == row['catalog_object_uri'], row
          assert row['checksum'] == row['catalog_checksum'], row
          assert row['row_count'] == row['catalog_row_count'], row
          assert row['manifest_id'] == result['manifest_id'], row

          client = boto3.client(
              's3', endpoint_url=os.environ.get('S3_ENDPOINT_URL') or None,
              region_name=os.environ.get('S3_REGION') or 'us-east-1',
              aws_access_key_id=os.environ['S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['S3_SECRET_ACCESS_KEY'])
          uri = row['object_uri'][5:]
          bucket, key = uri.split('/', 1)
          head = client.head_object(Bucket=bucket, Key=key)
          body = client.get_object(Bucket=bucket, Key=key)['Body'].read()
          import hashlib
          assert len(body) == head['ContentLength'], (len(body), head)
          assert hashlib.sha256(body).hexdigest() == row['checksum'], row
          print('archive S3 E2E: PASS')
          print(json.dumps({'campaign_id': os.environ['ARCHIVE_CAMPAIGN_ID'], 'object_uri': row['object_uri'], 'checksum': row['checksum'], 'manifest_id': str(row['manifest_id']), 'row_count': row['row_count']}))
          PY

      - name: Upload archive E2E artifact
        uses: actions/upload-artifact@v6
        with:
          name: archive-s3-e2e-${{ github.run_id }}
          path: archive_result.json
