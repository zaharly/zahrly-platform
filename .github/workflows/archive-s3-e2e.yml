name: Zahrly Archive S3 E2E

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Archive campaign ID to test
        required: true
        default: 74a52118-bffd-4438-9ddd-757928e094d4
        type: string

permissions:
  contents: read

concurrency:
  group: zahrly-archive-s3-e2e-${{ inputs.campaign_id }}
  cancel-in-progress: true

jobs:
  archive-s3-e2e:
    name: archive-s3-e2e
    runs-on: ubuntu-latest
    env:
      ARCHIVE_CAMPAIGN_ID: ${{ inputs.campaign_id }}
      SUPABASE_PROJECT_REF: qosvqlwkexrhswcuakib
      # GitHub-hosted runners require an IPv4-reachable Supabase endpoint.
      # The direct db.<project>.supabase.co endpoint may be IPv6-only.
      SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
      SUPABASE_POOLER_PORT: "5432"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # This is the real AWS S3 endpoint for the bucket shown in the AWS console.
      # Keep it in the workflow so an empty/mismatched S3_ENDPOINT_URL secret
      # cannot silently select the wrong endpoint.
      S3_ENDPOINT_URL: https://s3.eu-north-1.amazonaws.com
      S3_REGION: eu-north-1
      S3_BUCKET: zahrly-community-storage
      S3_PREFIX: ${{ secrets.S3_PREFIX }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate secrets and normalize configuration
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "missing GitHub secret: $v"; exit 1; }
          done
          test "$S3_BUCKET" = "zahrly-community-storage"
          test "$S3_REGION" = "eu-north-1"

          if [ -z "${S3_PREFIX:-}" ]; then
            echo "S3_PREFIX secret is empty; using zahrly/archive"
            echo "S3_PREFIX=zahrly/archive" >> "$GITHUB_ENV"
          fi

          python - <<'PY'
          import os
          from urllib.parse import quote, unquote, urlsplit, urlunsplit

          raw = os.environ["SUPABASE_DB_URL"].strip()
          p = urlsplit(raw)
          if p.scheme not in {"postgres", "postgresql"}:
              raise SystemExit(f"SUPABASE_DB_URL must use postgres:// or postgresql://, got {p.scheme!r}")
          if not p.hostname:
              raise SystemExit("SUPABASE_DB_URL has no hostname")
          if p.password is None:
              raise SystemExit("SUPABASE_DB_URL has no password")

          host = p.hostname.lower().rstrip(".")
          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          pooler_host = os.environ["SUPABASE_POOLER_HOST"]
          pooler_port = int(os.environ["SUPABASE_POOLER_PORT"])
          password = quote(unquote(p.password), safe="")
          user = unquote(p.username or "postgres")

          if host.endswith(".pooler.supabase.com"):
              selected_host = host
              selected_port = p.port or pooler_port
              if "." not in user:
                  user = f"postgres.{project_ref}"
              print("Using Supabase pooler URL from secret")
          elif host == f"db.{project_ref}.supabase.co":
              selected_host = pooler_host
              selected_port = pooler_port
              if user == "postgres":
                  user = f"postgres.{project_ref}"
              print("Detected direct Supabase URL; switching to IPv4 session pooler")
          else:
              raise SystemExit(
                  f"Unsupported SUPABASE_DB_URL host {host!r}. Expected the Supabase pooler "
                  f"or db.{project_ref}.supabase.co."
              )

          query = p.query or ""
          if "sslmode=" not in query:
              query = f"{query}&sslmode=require" if query else "sslmode=require"
          netloc = f"{quote(user, safe='')}:{password}@{selected_host}:{selected_port}"
          normalized = urlunsplit(("postgresql", netloc, p.path or "/postgres", query, ""))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"SUPABASE_DB_URL={normalized}\n")
          print(f"PostgreSQL endpoint selected: {selected_host}:{selected_port}")
          PY

      - name: Validate PostgreSQL IPv4 DNS and TCP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import socket
          from urllib.parse import urlsplit

          p = urlsplit(os.environ["SUPABASE_DB_URL"])
          host = p.hostname
          port = p.port or 5432
          print(f"PostgreSQL host: {host}")
          print(f"PostgreSQL port: {port}")

          try:
              addresses = socket.getaddrinfo(host, port, family=socket.AF_INET, type=socket.SOCK_STREAM)
          except socket.gaierror as exc:
              raise SystemExit(f"PostgreSQL IPv4 DNS FAILED for {host}: {exc}")
          if not addresses:
              raise SystemExit(f"PostgreSQL IPv4 DNS returned no A record for {host}")

          for family, _, _, _, sockaddr in addresses:
              try:
                  with socket.socket(family, socket.SOCK_STREAM) as s:
                      s.settimeout(15)
                      s.connect(sockaddr)
                  print(f"PostgreSQL IPv4 TCP: OK ({sockaddr[0]}:{sockaddr[1]})")
                  break
              except OSError as exc:
                  print(f"TCP attempt failed for {sockaddr[0]}:{sockaddr[1]}: {exc}")
          else:
              raise SystemExit("PostgreSQL IPv4 TCP FAILED for all resolved addresses")
          PY

      - name: Build archive worker image
        shell: bash
        run: docker build -f docker/Dockerfile.runtime -t zahrly-archive-worker:e2e .

      - name: Validate PostgreSQL authentication in container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --entrypoint python \
            -e SUPABASE_DB_URL \
            zahrly-archive-worker:e2e \
            -c 'import os,psycopg; from urllib.parse import urlparse; p=urlparse(os.environ["SUPABASE_DB_URL"]); print(f"Container PostgreSQL host: {p.hostname}"); print(f"Container PostgreSQL port: {p.port or 5432}"); c=psycopg.connect(os.environ["SUPABASE_DB_URL"],connect_timeout=15); print("PostgreSQL authentication: OK"); c.close()'

      - name: Validate S3 DNS and bucket access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import socket
          from urllib.parse import urlparse

          endpoint = os.environ["S3_ENDPOINT_URL"].strip()
          p = urlparse(endpoint)
          if p.scheme not in {"http", "https"} or not p.hostname:
              raise SystemExit(f"Invalid S3 endpoint: {endpoint!r}")
          print(f"S3 endpoint: {endpoint}")
          print(f"S3 region: {os.environ['S3_REGION']}")
          print(f"S3 bucket: {os.environ['S3_BUCKET']}")
          try:
              socket.getaddrinfo(p.hostname, p.port or 443, family=socket.AF_INET, type=socket.SOCK_STREAM)
          except socket.gaierror as exc:
              raise SystemExit(f"S3 IPv4 DNS FAILED for {p.hostname}: {exc}")
          print("S3 IPv4 DNS: OK")
          PY

          docker run --rm --network host --entrypoint python \
            -e S3_ENDPOINT_URL -e S3_REGION -e S3_BUCKET -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY \
            zahrly-archive-worker:e2e <<'PY'
          import os
          import boto3
          from botocore.exceptions import ClientError, EndpointConnectionError

          bucket = os.environ["S3_BUCKET"]
          endpoint = os.environ["S3_ENDPOINT_URL"]
          region = os.environ["S3_REGION"]

          client = boto3.client(
              "s3",
              region_name=region,
              endpoint_url=endpoint,
              aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
          )

          try:
              response = client.head_bucket(Bucket=bucket)
              status = response.get("ResponseMetadata", {}).get("HTTPStatusCode")
              print(f"S3 bucket access: OK (HTTP {status})")
          except EndpointConnectionError as exc:
              raise SystemExit(f"S3 endpoint connection FAILED: {exc}")
          except ClientError as exc:
              error = exc.response.get("Error", {})
              metadata = exc.response.get("ResponseMetadata", {})
              status = metadata.get("HTTPStatusCode")
              code = error.get("Code")
              request_id = metadata.get("RequestId")
              raise SystemExit(
                  "S3 bucket access FAILED: "
                  f"HTTP={status} code={code} request_id={request_id}. "
                  f"The bucket {bucket!r} must exist in region {region!r}, "
                  "and the GitHub AWS credentials must belong to an account with "
                  "s3:ListBucket and s3:GetBucketLocation permission on that bucket."
              )
          PY

      - name: Run archive worker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network host --entrypoint python \
            -e ARCHIVE_CAMPAIGN_ID \
            -e SUPABASE_DB_URL \
            -e S3_ENDPOINT_URL \
            -e S3_REGION \
            -e S3_BUCKET \
            -e S3_PREFIX \
            -e S3_ACCESS_KEY_ID \
            -e S3_SECRET_ACCESS_KEY \
            zahrly-archive-worker:e2e \
            -m workers.archive_worker.worker 2>&1 | tee archive_result.json
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "archive worker exited with status $status"
            exit "$status"
          fi

      - name: Verify archive result
        shell: bash
        run: |
          set -euo pipefail
          test -s archive_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          lines = [line.strip() for line in Path("archive_result.json").read_text().splitlines() if line.strip().startswith("{")]
          if not lines:
              raise SystemExit("archive worker produced no JSON result")
          data = json.loads(lines[-1])
          if data.get("processed") is not True or data.get("status") != "SUCCEEDED":
              raise SystemExit(f"archive worker did not succeed: {data}")
          print("Archive worker result: SUCCEEDED")
          print(f"campaign_id={data.get('campaign_id')}")
          print(f"object_uri={data.get('object_uri')}")
          print(f"checksum={data.get('checksum')}")
          print(f"manifest_id={data.get('manifest_id')}")
          PY

      - name: Upload archive E2E result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: archive-s3-e2e-${{ github.run_id }}
          path: archive_result.json
          if-no-files-found: ignore
