name: archive-s3-e2e

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Archive campaign ID to test
        required: true
        default: 74a52118-bffd-4438-9ddd-757928e094d4
        type: string

jobs:
  archive-s3-e2e:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_CAMPAIGN_ID: ${{ inputs.campaign_id }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PREFIX: ${{ secrets.S3_PREFIX }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets and defaults
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_BUCKET S3_REGION S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "missing GitHub secret: $v"; exit 1; }
          done
          if [ -z "${S3_PREFIX:-}" ]; then
            echo "S3_PREFIX secret is not set; using safe default: zahrly/archive"
            echo "S3_PREFIX=zahrly/archive" >> "$GITHUB_ENV"
          fi

      - name: Build archive worker image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile.runtime -t zahrly-archive-worker:e2e .

      - name: Diagnose PostgreSQL and authenticate from archive worker container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --entrypoint python \
            -e SUPABASE_DB_URL \
            zahrly-archive-worker:e2e \
            -c 'import os,socket,psycopg; from urllib.parse import urlparse; p=urlparse(os.environ["SUPABASE_DB_URL"]); h=p.hostname; port=p.port or 5432; print(f"PostgreSQL host: {h}"); print(f"PostgreSQL port: {port}"); socket.getaddrinfo(h,port,type=socket.SOCK_STREAM); print("PostgreSQL DNS: OK"); s=socket.create_connection((h,port),timeout=10); print("PostgreSQL TCP: OK"); s.close(); c=psycopg.connect(os.environ["SUPABASE_DB_URL"],connect_timeout=10); print("PostgreSQL authentication: OK"); c.close()'

      - name: Diagnose AWS S3 from archive worker container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --entrypoint python \
            -e S3_ENDPOINT_URL -e S3_REGION -e S3_BUCKET -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY \
            zahrly-archive-worker:e2e \
            -c 'import os,socket,boto3; from urllib.parse import urlparse; region=os.environ["S3_REGION"]; endpoint=os.environ.get("S3_ENDPOINT_URL","").strip() or f"https://s3.{region}.amazonaws.com"; p=urlparse(endpoint); print(f"S3 endpoint host: {p.hostname}"); socket.getaddrinfo(p.hostname,p.port or 443,type=socket.SOCK_STREAM); print("S3 DNS: OK"); kwargs=dict(service_name="s3",region_name=region,aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"]); custom=os.environ.get("S3_ENDPOINT_URL","").strip(); kwargs["endpoint_url"]=custom if custom else None; s3=boto3.client(**kwargs); s3.head_bucket(Bucket=os.environ["S3_BUCKET"]); print("S3 bucket access: OK")'

      - name: Run archive worker against test campaign
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --entrypoint python \
            -e ARCHIVE_CAMPAIGN_ID \
            -e SUPABASE_DB_URL \
            -e S3_ENDPOINT_URL \
            -e S3_REGION \
            -e S3_BUCKET \
            -e S3_PREFIX \
            -e S3_ACCESS_KEY_ID \
            -e S3_SECRET_ACCESS_KEY \
            zahrly-archive-worker:e2e \
            -m workers.archive_worker.worker | tee archive_result.json

      - name: Verify archive result
        shell: bash
        run: |
          set -euo pipefail
          test -s archive_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("archive_result.json").read_text().splitlines()[-1])
          if data.get("status") != "SUCCEEDED":
              raise SystemExit(f"archive worker did not succeed: {data}")
          print("Archive worker result: SUCCEEDED")
          print(f"campaign_id={data.get('campaign_id')}")
          print(f"object_uri={data.get('object_uri')}")
          print(f"checksum={data.get('checksum')}")
          print(f"manifest_id={data.get('manifest_id')}")
          PY
