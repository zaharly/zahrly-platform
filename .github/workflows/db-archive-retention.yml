name: Database Archive Retention to S3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/database_archive_retention.py'
      - '.github/workflows/db-archive-retention.yml'
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: read

concurrency:
  group: zahrly-db-archive-retention
  cancel-in-progress: false

jobs:
  archive-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      S3_ENDPOINT_URL: https://s3.eu-north-1.amazonaws.com
      S3_REGION: eu-north-1
      S3_BUCKET: zahrly-community-storage
      S3_PREFIX: zahrly/archive/database
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      KEEP_OOS_RUNS: '3'
      KEEP_RATING_MODELS: '2'
      CRON_RETENTION_DAYS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install maintenance dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' 'boto3>=1.35,<2'

      - name: Validate maintenance secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET; do
            test -n "${!v}" || { echo "missing runtime value: $v"; exit 1; }
          done

      - name: Normalize Supabase connection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import quote, unquote, urlsplit, urlunsplit
          raw=os.environ['SUPABASE_DB_URL'].strip()
          p=urlsplit(raw)
          if p.scheme not in {'postgres','postgresql'} or not p.hostname or p.password is None:
              raise SystemExit('invalid SUPABASE_DB_URL')
          host=p.hostname.lower().rstrip('.').lstrip('@')
          project='qosvqlwkexrhswcuakib'
          user=unquote(p.username or 'postgres')
          password=quote(unquote(p.password), safe='')
          if host.endswith('.pooler.supabase.com'):
              target_host=host
              target_port=p.port or 5432
              if '.' not in user:
                  user=f'postgres.{project}'
          elif host == f'db.{project}.supabase.co':
              target_host='aws-0-eu-central-1.pooler.supabase.com'
              target_port=5432
              if user == 'postgres':
                  user=f'postgres.{project}'
          else:
              raise SystemExit(f'unsupported Supabase host: {host}')
          query=p.query or ''
          if 'sslmode=' not in query:
              query=f'{query}&sslmode=require' if query else 'sslmode=require'
          normalized=urlunsplit(('postgresql',f'{quote(user,safe="")}:{password}@{target_host}:{target_port}',p.path or '/postgres',query,''))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('SUPABASE_DB_URL='+normalized+'\n')
          print(f'PostgreSQL endpoint selected: {target_host}:{target_port}')
          PY

      - name: Validate S3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, boto3
          c=boto3.client('s3', region_name=os.environ['S3_REGION'], endpoint_url=os.environ['S3_ENDPOINT_URL'], aws_access_key_id=os.environ['S3_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['S3_SECRET_ACCESS_KEY'])
          c.head_bucket(Bucket=os.environ['S3_BUCKET'])
          print('S3 access: OK')
          PY

      - name: Archive and prune database detail data
        run: python ops/database_archive_retention.py | tee database_archive_retention.json

      - name: Verify cleanup results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, psycopg
          from urllib.parse import quote, unquote, urlsplit, urlunsplit
          raw=os.environ['SUPABASE_DB_URL'].strip(); p=urlsplit(raw); host=p.hostname.lower().rstrip('.').lstrip('@'); user=unquote(p.username or 'postgres'); password=quote(unquote(p.password),safe='')
          project='qosvqlwkexrhswcuakib'
          if host.endswith('.pooler.supabase.com'):
              target_host,target_port=host,p.port or 5432
              if '.' not in user: user=f'postgres.{project}'
          else:
              target_host,target_port='aws-0-eu-central-1.pooler.supabase.com',5432
              if user=='postgres': user=f'postgres.{project}'
          query=p.query or 'sslmode=require'
          if 'sslmode=' not in query: query += '&sslmode=require'
          dsn=urlunsplit(('postgresql',f'{quote(user,safe="")}:{password}@{target_host}:{target_port}',p.path or '/postgres',query,''))
          with psycopg.connect(dsn) as c:
              db_size=c.execute('select pg_database_size(current_database())').fetchone()[0]
              checks=c.execute("""
                select
                  (select count(*) from internal.prediction_oos_benchmark) as oos_rows,
                  (select count(*) from internal.prediction_rating_checkpoints) as rating_rows,
                  (select count(*) from cron.job_run_details) as cron_rows
              """).fetchone()
              print(f'database_bytes={db_size}')
              print(f'database_mb={db_size/1024/1024:.1f}')
              print(f'oos_rows={checks[0]} rating_rows={checks[1]} cron_rows={checks[2]}')
          PY

      - name: Upload maintenance manifest
        uses: actions/upload-artifact@v6
        with:
          name: database-archive-retention-${{ github.run_id }}
          path: database_archive_retention.json
          if-no-files-found: error
