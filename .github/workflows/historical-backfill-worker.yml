name: historical-backfill-worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

env:
  PROVIDER_FIXTURE_PERSISTENCE_URL: https://qosvqlwkexrhswcuakib.supabase.co/functions/v1/provider-fixture-persistence

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build runtime image
        run: docker build -f docker/Dockerfile.runtime -t zahrly-historical-backfill:ci .

      - name: Process queued historical backfill jobs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PROVIDER_GATEWAY_SECRET: ${{ secrets.PROVIDER_GATEWAY_SECRET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          SUPABASE_DB_URL="$(printf '%s' "${SUPABASE_DB_URL}" | tr -d '\r\n')"
          API_FOOTBALL_KEY="$(printf '%s' "${API_FOOTBALL_KEY}" | tr -d '\r\n')"
          PROVIDER_GATEWAY_SECRET="$(printf '%s' "${PROVIDER_GATEWAY_SECRET}" | tr -d '\r\n')"
          S3_REGION="$(printf '%s' "${S3_REGION}" | tr -d '\r\n')"
          S3_BUCKET="$(printf '%s' "${S3_BUCKET}" | tr -d '\r\n')"
          S3_ACCESS_KEY_ID="$(printf '%s' "${S3_ACCESS_KEY_ID}" | tr -d '\r\n')"
          S3_SECRET_ACCESS_KEY="$(printf '%s' "${S3_SECRET_ACCESS_KEY}" | tr -d '\r\n')"
          export SUPABASE_DB_URL API_FOOTBALL_KEY PROVIDER_GATEWAY_SECRET PROVIDER_FIXTURE_PERSISTENCE_URL
          export S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY
          test -n "${SUPABASE_DB_URL}"
          test -n "${API_FOOTBALL_KEY}"
          test -n "${PROVIDER_GATEWAY_SECRET}"
          test -n "${S3_REGION}"
          test -n "${S3_BUCKET}"
          test -n "${S3_ACCESS_KEY_ID}"
          test -n "${S3_SECRET_ACCESS_KEY}"

          docker run --rm \
            -e SUPABASE_DB_URL \
            -e API_FOOTBALL_KEY \
            -e PROVIDER_GATEWAY_SECRET \
            -e PROVIDER_FIXTURE_PERSISTENCE_URL \
            -e S3_REGION \
            -e S3_BUCKET \
            -e S3_ACCESS_KEY_ID \
            -e S3_SECRET_ACCESS_KEY \
            -e BATCH_SIZE=10 \
            zahrly-historical-backfill:ci \
            python -m workers.historical_backfill.worker > historical_backfill.json

          cat historical_backfill.json
