name: historical-backfill-worker

on:
  push:
    paths:
      - '.github/workflows/historical-backfill-worker.yml'
      - 'workers/historical_backfill/**'
      - 'docker/Dockerfile.runtime'
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-backfill-production
  cancel-in-progress: false

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build runtime image
        run: docker build -f docker/Dockerfile.runtime -t zahrly-historical-backfill:ci .

      - name: Run continuous historical worker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PROVIDER_GATEWAY_SECRET: ${{ secrets.PROVIDER_GATEWAY_SECRET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          WORKER_SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          test -n "${API_FOOTBALL_KEY}"
          test -n "${S3_REGION}"
          test -n "${S3_BUCKET}"
          test -n "${S3_ACCESS_KEY_ID}"
          test -n "${S3_SECRET_ACCESS_KEY}"
          docker run --rm \
            -e SUPABASE_DB_URL \
            -e API_FOOTBALL_KEY \
            -e PROVIDER_GATEWAY_SECRET \
            -e S3_REGION \
            -e S3_BUCKET \
            -e S3_ACCESS_KEY_ID \
            -e S3_SECRET_ACCESS_KEY \
            -e S3_ENDPOINT_URL \
            -e WORKER_SLOT \
            -e BATCH_SIZE=25 \
            -e WORKER_RATE_LIMIT_PER_MINUTE=12 \
            -e IDLE_SLEEP_SECONDS=10 \
            -e MAX_RUNTIME_SECONDS=2700 \
            zahrly-historical-backfill:ci \
            python -m workers.historical_backfill.continuous_runner
