name: historical-backfill-worker

on:
  push:
    paths:
      - '.github/workflows/historical-backfill-worker.yml'
      - 'workers/historical_backfill/**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - name: Checkout repository with native git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Validate Python runtime
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip --version

      - name: Install worker dependencies
        run: python3 -m pip install -r workers/historical_backfill/requirements.txt

      - name: Validate runtime secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          test -n "${API_FOOTBALL_KEY}"
          test -n "${S3_REGION}"
          test -n "${S3_BUCKET}"
          test -n "${S3_ACCESS_KEY_ID}"
          test -n "${S3_SECRET_ACCESS_KEY}"

      - name: Validate Python imports
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 -m py_compile workers/historical_backfill/safe_entrypoint.py workers/historical_backfill/canonical_runner.py workers/historical_backfill/worker.py workers/historical_backfill/archive_metadata.py
          python3 -c "from workers.historical_backfill import safe_entrypoint, canonical_runner, worker; print('historical worker import preflight: OK')"

      - name: Run canonical historical worker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          WORKER_SLOT: ${{ matrix.slot }}
          IDLE_SLEEP_SECONDS: '5'
          MAX_RUNTIME_SECONDS: '840'
          MAX_CLAIM_SCAN: '50'
        run: |
          set -euo pipefail
          python3 -m workers.historical_backfill.safe_entrypoint
