name: historical-backfill-worker

on:
  push:
    paths:
      - '.github/workflows/historical-backfill-worker.yml'
      - 'workers/historical_backfill/**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-backfill-production
  cancel-in-progress: false

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/historical_backfill/requirements.txt

      - name: Install worker dependencies
        run: python -m pip install -r workers/historical_backfill/requirements.txt

      - name: Run continuous historical worker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PROVIDER_GATEWAY_SECRET: ${{ secrets.PROVIDER_GATEWAY_SECRET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          WORKER_SLOT: ${{ matrix.slot }}
          BATCH_SIZE: '25'
          WORKER_RATE_LIMIT_PER_MINUTE: '12'
          IDLE_SLEEP_SECONDS: '10'
          MAX_RUNTIME_SECONDS: '2700'
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          test -n "${API_FOOTBALL_KEY}"
          test -n "${S3_REGION}"
          test -n "${S3_BUCKET}"
          test -n "${S3_ACCESS_KEY_ID}"
          test -n "${S3_SECRET_ACCESS_KEY}"
          python -m workers.historical_backfill.continuous_runner
