name: Prediction Job Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: prediction-job-worker-production
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'psycopg[binary]' boto3 requests

      - name: Configure Supabase IPv4 Session Pooler
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import quote, urlsplit, urlunsplit
          raw = os.environ['SUPABASE_DB_URL_RAW'].strip()
          parts = urlsplit(raw)
          if parts.scheme not in {'postgres', 'postgresql'} or not parts.username or parts.password is None:
              raise SystemExit('invalid SUPABASE_DB_URL format')
          project_ref = 'qosvqlwkexrhswcuakib'
          host = 'aws-0-eu-central-1.pooler.supabase.com'
          fixed = urlunsplit((parts.scheme, f'{quote("postgres." + project_ref, safe="")}:{quote(parts.password, safe="")}@{host}:5432', '/postgres', 'sslmode=require', ''))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('SUPABASE_DB_URL=' + fixed + '\n')
          PY

      - name: Validate runtime
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_REGION S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "missing runtime value: $v"; exit 1; }
          done
          python -m py_compile workers/prediction_engine/prediction_job_worker.py
          python -m py_compile workers/prediction_engine/prediction_lifecycle.py

      - name: Run queued prediction jobs
        run: python -m workers.prediction_engine.prediction_job_worker
