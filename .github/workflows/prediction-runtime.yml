name: Prediction Runtime - GitHub Actions

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: prediction-runtime-production
  cancel-in-progress: false

jobs:
  prediction-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'psycopg[binary]' boto3 requests

      - name: Validate runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_REGION S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "missing runtime value: $v"; exit 1; }
          done

      - name: Validate Python runtime
        run: python -m py_compile workers/prediction_engine/rolling_prediction_cycle.py

      - name: Run prediction lifecycle
        run: python -m workers.prediction_engine.rolling_prediction_cycle
