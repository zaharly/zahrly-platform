name: Prediction Runtime - GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prediction-runtime.yml'
      - 'workers/prediction_engine/rolling_prediction_cycle.py'
      - 'workers/prediction_engine/prediction_runtime_entrypoint.py'
      - 'workers/prediction_engine/prediction_lifecycle.py'
      - 'supabase/migrations/20260905180000_prediction_lifecycle_contract_v1.sql'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: prediction-runtime-production
  cancel-in-progress: true

jobs:
  prediction-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'psycopg[binary]' boto3 requests

      - name: Configure Supabase IPv4 Session Pooler
        shell: bash
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import quote, urlsplit, urlunsplit
          raw = os.environ['SUPABASE_DB_URL_RAW'].strip()
          parts = urlsplit(raw)
          if parts.scheme not in {'postgres', 'postgresql'} or not parts.username or parts.password is None:
              raise SystemExit('invalid SUPABASE_DB_URL format')
          project_ref = 'qosvqlwkexrhswcuakib'
          pooler_host = 'aws-0-eu-central-1.pooler.supabase.com'
          username = quote('postgres.' + project_ref, safe='')
          password = quote(parts.password, safe='')
          fixed = urlunsplit((parts.scheme, f'{username}:{password}@{pooler_host}:5432', '/postgres', 'sslmode=require', ''))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('SUPABASE_DB_URL=' + fixed + '\n')
          print('Supabase IPv4 Session Pooler configured')
          PY

      - name: Retire legacy Supabase prediction schedulers
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import os
          import psycopg
          names = [
              'prediction-shadow-scheduler-v1',
              'prediction-controlled-canary-scheduler-v1',
              'prediction-market-evidence-v1',
              'prediction-market-benchmark-v1',
              'prediction-market-settlement-sync-v1',
              'prediction-promotion-gate-runner-v1',
          ]
          conn = psycopg.connect(os.environ['SUPABASE_DB_URL'], connect_timeout=20, sslmode='require')
          try:
              for name in names:
                  try:
                      with conn.cursor() as cur:
                          cur.execute('select cron.unschedule(%s)', (name,))
                      conn.commit()
                      print('retired:', name)
                  except Exception as exc:
                      conn.rollback()
                      print('legacy scheduler not retired:', name, type(exc).__name__, str(exc))
          finally:
              conn.close()
          PY

      - name: Validate runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_REGION S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "missing runtime value: $v"; exit 1; }
          done

      - name: Apply prediction lifecycle schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          sql = Path('supabase/migrations/20260905180000_prediction_lifecycle_contract_v1.sql').read_text(encoding='utf-8')
          with psycopg.connect(os.environ['SUPABASE_DB_URL'], connect_timeout=20, sslmode='require') as conn:
              conn.execute(sql)
              conn.commit()
          print('prediction lifecycle schema verified')
          PY

      - name: Validate Python runtime
        run: |
          python -m py_compile workers/prediction_engine/rolling_prediction_cycle.py
          python -m py_compile workers/prediction_engine/prediction_runtime_entrypoint.py
          python -m py_compile workers/prediction_engine/prediction_lifecycle.py

      - name: Run prediction lifecycle
        run: python -m workers.prediction_engine.prediction_runtime_entrypoint
