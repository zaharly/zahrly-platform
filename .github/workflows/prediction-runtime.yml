name: Prediction Runtime - GitHub Actions

# Canonical execution path: queued prediction jobs -> lifecycle gate -> published read model.
# Historical training is manual-only; this workflow never retrains the model.
# Runtime verification is intentionally performed by GitHub Actions only.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prediction-runtime.yml'
      - 'workers/prediction_engine/rolling_prediction_cycle.py'
      - 'workers/prediction_engine/prediction_model_core.py'
      - 'workers/prediction_engine/prediction_inference.py'
      - 'workers/prediction_engine/market_derivations.py'
      - 'workers/prediction_engine/prediction_runtime_entrypoint.py'
      - 'workers/prediction_engine/prediction_lifecycle.py'
      - 'workers/prediction_engine/prediction_job_worker.py'
      - 'workers/prediction_engine/tests/**'
      - 'supabase/migrations/20260905180000_prediction_lifecycle_contract_v1.sql'
      - 'supabase/migrations/20260905185600_prediction_lifecycle_evidence_readmodel_v2.sql'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: prediction-runtime-production
  cancel-in-progress: false

jobs:
  prediction-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'psycopg[binary]' boto3 requests pytest
      - name: Configure Supabase IPv4 Session Pooler
        shell: bash
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import quote, urlsplit, urlunsplit
          raw = os.environ['SUPABASE_DB_URL_RAW'].strip()
          parts = urlsplit(raw)
          if parts.scheme not in {'postgres', 'postgresql'} or not parts.username or parts.password is None:
              raise SystemExit('invalid SUPABASE_DB_URL format')
          project_ref = 'qosvqlwkexrhswcuakib'
          pooler_host = 'aws-0-eu-central-1.pooler.supabase.com'
          username = quote('postgres.' + project_ref, safe='')
          password = quote(parts.password, safe='')
          fixed = urlunsplit((parts.scheme, f'{username}:{password}@{pooler_host}:5432', '/postgres', 'sslmode=require', ''))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('SUPABASE_DB_URL=' + fixed + '\n')
          print('Supabase IPv4 Session Pooler configured')
          PY
      - name: Validate runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_REGION S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            test -n "${!v}" || { echo "missing runtime value: $v"; exit 1; }
          done
      - name: Apply prediction lifecycle schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          migrations = [
              Path('supabase/migrations/20260905180000_prediction_lifecycle_contract_v1.sql'),
              Path('supabase/migrations/20260905185600_prediction_lifecycle_evidence_readmodel_v2.sql'),
          ]
          with psycopg.connect(os.environ['SUPABASE_DB_URL'], connect_timeout=20, sslmode='require') as conn:
              for path in migrations:
                  conn.execute(path.read_text(encoding='utf-8'))
              conn.commit()
          print('prediction lifecycle schema verified')
          PY
      - name: Validate lifecycle contract and unit tests
        run: |
          python -m py_compile workers/prediction_engine/rolling_prediction_cycle.py
          python -m py_compile workers/prediction_engine/prediction_model_core.py
          python -m py_compile workers/prediction_engine/prediction_inference.py
          python -m py_compile workers/prediction_engine/market_derivations.py
          python -m py_compile workers/prediction_engine/prediction_runtime_entrypoint.py
          python -m py_compile workers/prediction_engine/prediction_lifecycle.py
          python -m py_compile workers/prediction_engine/prediction_job_worker.py
          pytest -q workers/prediction_engine/tests/test_model_and_markets.py
      - name: Run queued prediction jobs
        run: python -m workers.prediction_engine.prediction_job_worker
