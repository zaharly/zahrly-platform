name: Prediction Training - S3 Archive OOS

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated seasons; blank = all archived seasons'
        required: false
        default: ''
      min_oos_seasons:
        description: 'Minimum complete seasons required for OOS readiness'
        required: false
        default: '3'
      min_oos_matches:
        description: 'Minimum match rows required for OOS readiness'
        required: false
        default: '3000'
  push:
    branches:
      - 'prediction/training-archive-oos-v2'

jobs:
  archive-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: zahrly-community-storage
      SUPABASE_URL: https://qosvqlwkexrhswcuakib.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ARCHIVE_SEASONS: ${{ inputs.seasons || '' }}
      OOS_MIN_SEASONS: ${{ inputs.min_oos_seasons || '3' }}
      OOS_MIN_MATCHES: ${{ inputs.min_oos_matches || '3000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r training/archive_oos/requirements.txt
      - name: Verify AWS identity and archive bucket access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}" || { echo 'S3_REGION secret is empty'; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID}" || { echo 'S3_ACCESS_KEY_ID secret is empty'; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY}" || { echo 'S3_SECRET_ACCESS_KEY secret is empty'; exit 1; }
          aws sts get-caller-identity
          aws s3api get-bucket-location --bucket "${S3_BUCKET}"
          aws s3api list-objects-v2 --bucket "${S3_BUCKET}" --prefix zahrly/archive/ --max-items 5
      - name: Validate S3 archive against catalog manifests
        run: python training/archive_oos/run.py
