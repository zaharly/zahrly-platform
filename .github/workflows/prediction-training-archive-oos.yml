name: Prediction Training - S3 Archive OOS

# Historical-only training path. Never touches 7-Day Rolling or active campaigns.
# Uses Supabase Supavisor Session Pooler because GitHub Actions is IPv4-only.
# This workflow is intentionally present on this branch so branch pushes can execute it.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated archived seasons; blank = all eligible seasons'
        required: false
        default: ''
      min_oos_seasons:
        description: 'Minimum complete OOS seasons required'
        required: false
        default: '3'
      min_oos_matches:
        description: 'Minimum OOS predictions required'
        required: false
        default: '3000'
  push:
    branches:
      - 'prediction/training-archive-oos-v2'

concurrency:
  group: prediction-training-archive-oos-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  archive-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: zahrly-community-storage
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      SUPABASE_URL: https://qosvqlwkexrhswcuakib.supabase.co
      SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ARCHIVE_SEASONS: ${{ inputs.seasons || '' }}
      OOS_MIN_SEASONS: ${{ inputs.min_oos_seasons || '3' }}
      OOS_MIN_MATCHES: ${{ inputs.min_oos_matches || '3000' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install archive and prediction dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r training/archive_oos/requirements.txt
          pip install -r workers/archive_worker/requirements.txt
      - name: Validate required credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SUPABASE_DB_URL_RAW SUPABASE_SERVICE_ROLE_KEY S3_BUCKET API_FOOTBALL_KEY; do
            test -n "${!v}" || { echo "missing runtime value: $v"; exit 1; }
          done
      - name: Verify AWS identity and archive bucket access
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws s3api get-bucket-location --bucket "${S3_BUCKET}"
          aws s3api list-objects-v2 --bucket "${S3_BUCKET}" --prefix zahrly/archive/ --max-items 5
      - name: Configure Supabase IPv4 Session Pooler
        shell: bash
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, quote, urlunsplit
          import psycopg
          raw = os.environ['SUPABASE_DB_URL_RAW'].strip()
          parts = urlsplit(raw)
          if parts.scheme not in {'postgres', 'postgresql'} or not parts.username or parts.password is None:
              raise SystemExit('invalid SUPABASE_DB_URL format')
          project_host = urlsplit(os.environ['SUPABASE_URL']).hostname
          project_ref = project_host.split('.', 1)[0] if project_host else ''
          if project_ref != 'qosvqlwkexrhswcuakib':
              raise SystemExit('unexpected Supabase project reference')
          pooler_host = 'aws-0-eu-central-1.pooler.supabase.com'
          username = quote('postgres.' + project_ref, safe='')
          password = quote(parts.password, safe='')
          fixed = urlunsplit((parts.scheme, f'{username}:{password}@{pooler_host}:5432', '/postgres', 'sslmode=require', ''))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('SUPABASE_DB_URL=' + fixed + '\n')
          with psycopg.connect(fixed, connect_timeout=20, sslmode='require') as conn:
              conn.execute('select 1')
          print('Supabase IPv4 Session Pooler connectivity: OK')
          PY
      - name: Validate archive manifests and checksums
        run: python training/archive_oos/run.py
      - name: Rehydrate missing historical fixture payloads from canonical API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from urllib.parse import quote
          import boto3
          import psycopg
          import requests

          db_url = os.environ['SUPABASE_DB_URL']
          api_key = os.environ['API_FOOTBALL_KEY'].strip()
          s3 = boto3.client('s3', region_name=os.environ['S3_REGION'], aws_access_key_id=os.environ['S3_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['S3_SECRET_ACCESS_KEY'])
          headers = {'x-apisports-key': api_key, 'Accept': 'application/json'}

          with psycopg.connect(db_url, connect_timeout=20) as conn:
              rows = conn.execute("""
                  select manifest_id::text, season, row_count, object_uri, checksum
                  from internal.archive_catalog
                  where provider='api-football' and dataset_type='fixtures' and season in (2008,2009,2010)
                  order by season, object_uri
              """).fetchall()
          if len(rows) != 17:
              raise SystemExit(f'expected 17 historical fixture manifests, got {len(rows)}')

          prepared = []
          for manifest_id, season, expected_rows, uri, old_checksum in rows:
              m = re.search(r'/league=([^/]+)/dataset=fixtures/', uri)
              if not m:
                  raise SystemExit(f'cannot extract league from {uri}')
              league = m.group(1)
              response = requests.get(f'https://v3.football.api-sports.io/fixtures?league={quote(league)}&season={season}', headers=headers, timeout=30)
              response.raise_for_status()
              document = response.json()
              data = document.get('response') if isinstance(document, dict) else None
              if not isinstance(data, list) or document.get('errors'):
                  raise SystemExit(f'API response invalid for season={season} league={league}: errors={document.get("errors") if isinstance(document, dict) else "non-object"}')
              if len(data) != int(expected_rows):
                  raise SystemExit(f'row-count mismatch season={season} league={league}: catalog={expected_rows} api={len(data)}')
              body = (json.dumps(document, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode('utf-8')
              checksum = hashlib.sha256(body).hexdigest()
              bucket, key = uri[5:].split('/', 1)
              prepared.append((manifest_id, season, league, int(expected_rows), bucket, key, checksum, body, old_checksum))
              print(f'validated season={season} league={league} rows={len(data)}', flush=True)
              time.sleep(1.0)

          with psycopg.connect(db_url, connect_timeout=20) as conn:
              with conn.transaction():
                  for manifest_id, season, league, row_count, bucket, key, checksum, body, old_checksum in prepared:
                      s3.put_object(Bucket=bucket, Key=key, Body=body, ContentType='application/json', Metadata={'sha256': checksum, 'archive_repair': 'canonical-api-football-fixtures'})
                      verify = s3.get_object(Bucket=bucket, Key=key)['Body'].read()
                      if hashlib.sha256(verify).hexdigest() != checksum:
                          raise SystemExit(f'S3 checksum verification failed season={season} league={league}')
                      conn.execute('update internal.archive_catalog set checksum=%s, row_count=%s where manifest_id=%s', (checksum, row_count, manifest_id))
          print(json.dumps({'status':'REPAIRED','manifest_count':len(prepared),'seasons':[2008,2009,2010]}, sort_keys=True))
          PY
      - name: Run historical training from S3 archive
        run: python -m workers.prediction_engine.historical_training_job
      - name: Persist Elo/Glicko rating checkpoints
        if: success()
        run: python -m workers.prediction_engine.rating_checkpoints
      - name: Build persisted OOS benchmark (Brier/ECE/RPS + market coverage)
        if: success()
        run: python -m workers.prediction_engine.oos_benchmark
      - name: Evaluate promotion gates without activation
        if: success()
        run: python -m workers.prediction_engine.benchmark_gate
