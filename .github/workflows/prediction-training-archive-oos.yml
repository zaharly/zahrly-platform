name: Prediction Training - S3 Archive OOS

# Historical-only training path. Never touches 7-Day Rolling or active campaigns.
# Uses Supabase Supavisor Session Pooler because GitHub Actions is IPv4-only.
# This workflow is intentionally present on this branch so branch pushes can execute it.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated archived seasons; blank = all eligible seasons'
        required: false
        default: ''
      min_oos_seasons:
        description: 'Minimum complete OOS seasons required'
        required: false
        default: '3'
      min_oos_matches:
        description: 'Minimum OOS predictions required'
        required: false
        default: '3000'
  push:
    branches:
      - 'prediction/training-archive-oos-v2'

concurrency:
  group: prediction-training-archive-oos-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  archive-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: zahrly-community-storage
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      SUPABASE_URL: https://qosvqlwkexrhswcuakib.supabase.co
      SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ARCHIVE_SEASONS: ${{ inputs.seasons || '' }}
      OOS_MIN_SEASONS: ${{ inputs.min_oos_seasons || '3' }}
      OOS_MIN_MATCHES: ${{ inputs.min_oos_matches || '3000' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install archive and prediction dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r training/archive_oos/requirements.txt
          pip install -r workers/archive_worker/requirements.txt
      - name: Validate required credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SUPABASE_DB_URL_RAW SUPABASE_SERVICE_ROLE_KEY S3_BUCKET; do
            test -n "${!v}" || { echo "missing runtime value: $v"; exit 1; }
          done
      - name: Verify AWS identity and archive bucket access
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws s3api get-bucket-location --bucket "${S3_BUCKET}"
          aws s3api list-objects-v2 --bucket "${S3_BUCKET}" --prefix zahrly/archive/ --max-items 5
      - name: Configure Supabase IPv4 Session Pooler
        shell: bash
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, quote, urlunsplit
          import psycopg
          raw = os.environ['SUPABASE_DB_URL_RAW'].strip()
          parts = urlsplit(raw)
          if parts.scheme not in {'postgres', 'postgresql'} or not parts.username or parts.password is None:
              raise SystemExit('invalid SUPABASE_DB_URL format')
          project_host = urlsplit(os.environ['SUPABASE_URL']).hostname
          project_ref = project_host.split('.', 1)[0] if project_host else ''
          if project_ref != 'qosvqlwkexrhswcuakib':
              raise SystemExit('unexpected Supabase project reference')
          pooler_host = 'aws-0-eu-central-1.pooler.supabase.com'
          username = quote('postgres.' + project_ref, safe='')
          password = quote(parts.password, safe='')
          fixed = urlunsplit((parts.scheme, f'{username}:{password}@{pooler_host}:5432', '/postgres', 'sslmode=require', ''))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('SUPABASE_DB_URL=' + fixed + '\n')
          with psycopg.connect(fixed, connect_timeout=20, sslmode='require') as conn:
              conn.execute('select 1')
          print('Supabase IPv4 Session Pooler connectivity: OK')
          PY
      - name: Validate archive manifests and checksums
        run: python training/archive_oos/run.py
      - name: Inspect representative legacy fixture payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import boto3, json
          s3 = boto3.client('s3', region_name='${{ secrets.S3_REGION }}')
          keys = {
              '2008': 'zahrly/archive/historical/raw/provider=api-football/season=2008/country=API_216cb4cb-79eb-499d-8f1c-7bb9f5e38b45/league=4/dataset=fixtures/job=1c98738c-3d7e-4c3e-b67d-cb372f8bbfd9.json',
              '2009': 'zahrly/archive/historical/raw/provider=api-football/season=2009/country=API_216cb4cb-79eb-499d-8f1c-7bb9f5e38b45/league=21/dataset=fixtures/job=e43ddd6c-200a-4d9d-8973-7b31c2a36a04.json',
              '2010': 'zahrly/archive/historical/raw/provider=api-football/season=2010/country=GB-SCT/league=179/dataset=fixtures/job=2c421e2b-b124-49ed-a2a7-a7ecf16e4179.json',
              '2011': 'zahrly/archive/historical/raw/provider=api-football/season=2011/league=388/dataset=fixtures/job=93556da1-74be-4a44-9186-ec4019440884.json',
          }
          for season, key in keys.items():
              body = s3.get_object(Bucket='zahrly-community-storage', Key=key)['Body'].read()
              print(f'PAYLOAD {season}: bytes={len(body)} prefix_hex={body[:32].hex()}')
              print(f'PAYLOAD {season}: prefix={body[:1000]!r}')
              try:
                  obj = json.loads(body.decode('utf-8-sig'))
                  if isinstance(obj, dict):
                      print(f'PAYLOAD {season}: json_type=dict keys={list(obj.keys())[:30]}')
                  else:
                      print(f'PAYLOAD {season}: json_type={type(obj).__name__} length={len(obj)}')
              except Exception as exc:
                  print(f'PAYLOAD {season}: json_decode_error={type(exc).__name__}:{exc}')
          PY
      - name: Run historical training from S3 archive
        run: python -m workers.prediction_engine.historical_training_job
      - name: Persist Elo/Glicko rating checkpoints
        if: success()
        run: python -m workers.prediction_engine.rating_checkpoints
      - name: Build persisted OOS benchmark (Brier/ECE/RPS + market coverage)
        if: success()
        run: python -m workers.prediction_engine.oos_benchmark
      - name: Evaluate promotion gates without activation
        if: success()
        run: python -m workers.prediction_engine.benchmark_gate