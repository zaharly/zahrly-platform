name: One-shot cleanup stale prediction artifacts

# Temporary one-shot cleanup. Runs once on the commit that creates this workflow,
# archives the known stale SUCCEEDED training run, then is removed after verification.
on:
  push:
    branches:
      - 'prediction/training-archive-oos-v2'

concurrency:
  group: prediction-training-stale-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: zahrly-community-storage
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      SUPABASE_URL: https://qosvqlwkexrhswcuakib.supabase.co
      SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PREDICTION_TRAINING_RUN_ID: b006ed4b-81a1-4491-aad2-9618f33ef410
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install archive dependencies
        run: pip install -r workers/archive_worker/requirements.txt
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SUPABASE_DB_URL_RAW SUPABASE_SERVICE_ROLE_KEY S3_BUCKET; do
            test -n "${!v}" || { echo "missing runtime value: $v"; exit 1; }
          done
      - name: Configure Supabase IPv4 Session Pooler
        shell: bash
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, quote, urlunsplit
          import psycopg
          raw = os.environ['SUPABASE_DB_URL_RAW'].strip()
          parts = urlsplit(raw)
          if parts.scheme not in {'postgres', 'postgresql'} or not parts.username or parts.password is None:
              raise SystemExit('invalid SUPABASE_DB_URL format')
          project_ref = urlsplit(os.environ['SUPABASE_URL']).hostname.split('.', 1)[0]
          if project_ref != 'qosvqlwkexrhswcuakib':
              raise SystemExit('unexpected Supabase project reference')
          pooler_host = 'aws-0-eu-central-1.pooler.supabase.com'
          fixed = urlunsplit((parts.scheme, f'{quote("postgres." + project_ref, safe="")}:{quote(parts.password, safe="")}@{pooler_host}:5432', '/postgres', 'sslmode=require', ''))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('SUPABASE_DB_URL=' + fixed + '\n')
          with psycopg.connect(fixed, connect_timeout=20, sslmode='require') as conn:
              row = conn.execute("""
                select tr.id::text, tr.status, tr.model_version_id::text,
                       (select count(*) from internal.prediction_oos_benchmark o where o.training_run_id=tr.id) as oos_rows,
                       (select count(*) from internal.prediction_rating_checkpoints r where r.model_version_id=tr.model_version_id) as rating_rows
                from internal.prediction_training_runs tr
                where tr.id=%s
              """, (os.environ['PREDICTION_TRAINING_RUN_ID'],)).fetchone()
              print({'run':row[0], 'status':row[1], 'model_version_id':row[2], 'oos_rows':row[3], 'rating_rows':row[4]})
              if not row or row[1] != 'SUCCEEDED' or int(row[3]) != 29679 or int(row[4]) != 84460:
                  raise SystemExit('stale-run invariant failed; refusing cleanup')
          PY
      - name: Verify AWS identity and target bucket
        run: |
          aws sts get-caller-identity
          aws s3api get-bucket-location --bucket "${S3_BUCKET}"
      - name: Archive stale run to S3 and delete only after verified upload
        run: python -m workers.prediction_engine.archive_prediction_artifacts
      - name: Verify zero transient rows and database state
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['SUPABASE_DB_URL'], connect_timeout=20, sslmode='require') as conn:
              row = conn.execute("""
                select
                  pg_size_pretty(pg_database_size(current_database())) as db_size,
                  (select count(*) from internal.prediction_rating_checkpoints) as rating_rows,
                  (select count(*) from internal.prediction_oos_benchmark) as oos_rows,
                  (select count(*) from internal.prediction_artifacts) as artifact_rows
              """).fetchone()
              print({'db_size':row[0], 'rating_rows':row[1], 'oos_rows':row[2], 'artifact_rows':row[3]})
              if int(row[1]) != 0 or int(row[2]) != 0:
                  raise SystemExit('transient artifact rows remain after archive')
          PY
