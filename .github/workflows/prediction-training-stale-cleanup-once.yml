name: One-shot stale prediction artifact cleanup

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: zahrly-community-storage
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      SUPABASE_URL: https://qosvqlwkexrhswcuakib.supabase.co
      SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
      PREDICTION_TRAINING_RUN_ID: b006ed4b-81a1-4491-aad2-9618f33ef410
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prediction/training-archive-oos-v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install archive dependencies
        run: pip install -r workers/archive_worker/requirements.txt
      - name: Configure Supabase IPv4 Session Pooler
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, quote, urlunsplit
          import psycopg
          raw=os.environ['SUPABASE_DB_URL_RAW'].strip()
          parts=urlsplit(raw)
          ref=urlsplit(os.environ['SUPABASE_URL']).hostname.split('.',1)[0]
          pooler='aws-0-eu-central-1.pooler.supabase.com'
          fixed=urlunsplit((parts.scheme,f'{quote("postgres."+ref,safe="")}:{quote(parts.password,safe="")}@{pooler}:5432','/postgres','sslmode=require',''))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write('SUPABASE_DB_URL='+fixed+'\n')
          with psycopg.connect(fixed,connect_timeout=20,sslmode='require') as conn: conn.execute('select 1')
          print('Supabase connectivity: OK')
          PY
      - name: Archive target run using canonical verified archive worker
        run: python -m workers.prediction_engine.archive_prediction_artifacts
      - name: Verify transient artifact rows are zero
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['SUPABASE_DB_URL'],connect_timeout=20,sslmode='require') as conn:
              row=conn.execute("select (select count(*) from internal.prediction_rating_checkpoints),(select count(*) from internal.prediction_oos_benchmark)").fetchone()
              print({'rating_rows':row[0],'oos_rows':row[1]})
              if int(row[0]) or int(row[1]): raise SystemExit('transient rows remain')
          PY
