name: One-shot stale prediction artifact cleanup

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: zahrly-community-storage
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      SUPABASE_URL: https://qosvqlwkexrhswcuakib.supabase.co
      SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_RUN: b006ed4b-81a1-4491-aad2-9618f33ef410
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install boto3 psycopg[binary]==3.2.9
      - name: Archive verified stale run and remove transient rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, os, tempfile
          from pathlib import Path
          import boto3, psycopg
          from psycopg.rows import dict_row
          from urllib.parse import urlsplit, quote, urlunsplit

          raw=os.environ['SUPABASE_DB_URL_RAW'].strip()
          parts=urlsplit(raw)
          ref=urlsplit(os.environ['SUPABASE_URL']).hostname.split('.',1)[0]
          pooler='aws-0-eu-central-1.pooler.supabase.com'
          db=urlunsplit((parts.scheme, f'{quote("postgres."+ref,safe="")}:{quote(parts.password,safe="")}@{pooler}:5432', '/postgres', 'sslmode=require', ''))
          target=os.environ['TARGET_RUN']
          bucket=os.environ['S3_BUCKET']
          region=os.environ.get('S3_REGION') or 'eu-north-1'
          s3=boto3.client('s3',region_name=region,aws_access_key_id=os.environ['S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['S3_SECRET_ACCESS_KEY'])

          with psycopg.connect(db,row_factory=dict_row,connect_timeout=20,sslmode='require') as conn:
              run=conn.execute("""
                select tr.id::text as training_run_id,tr.status,tr.model_version_id::text as model_version_id,
                       (select count(*) from internal.prediction_oos_benchmark o where o.training_run_id=tr.id) as oos_rows,
                       (select count(*) from internal.prediction_rating_checkpoints r where r.model_version_id=tr.model_version_id) as rating_rows
                from internal.prediction_training_runs tr where tr.id=%s
              """,(target,)).fetchone()
              if not run or run['status']!='SUCCEEDED' or int(run['oos_rows'])!=29679 or int(run['rating_rows'])!=84460:
                  raise SystemExit(f'refusing cleanup: {dict(run) if run else None}')

              artifacts=[]
              with tempfile.TemporaryDirectory(prefix='zahrly-stale-archive-') as tmp:
                  for artifact_type,table,where_col,prefix,expected in [
                      ('RATING_CHECKPOINTS','prediction_rating_checkpoints','model_version_id','zahrly/archive/database/prediction_rating_checkpoints',84460),
                      ('OOS_BENCHMARK','prediction_oos_benchmark','training_run_id','zahrly/archive/database/prediction_oos_benchmark',29679),
                  ]:
                      path=Path(tmp)/f'{artifact_type}.jsonl.gz'
                      count=0
                      with gzip.open(path,'wb',compresslevel=6) as out:
                          with conn.cursor() as cur:
                              cur.execute(f'select * from internal.{table} where {where_col}=%s order by id',(run['model_version_id'] if artifact_type=='RATING_CHECKPOINTS' else run['training_run_id'],))
                              while True:
                                  rows=cur.fetchmany(1000)
                                  if not rows: break
                                  for row in rows:
                                      out.write(json.dumps(dict(row),ensure_ascii=False,separators=(',',':'),default=str).encode()+b'\n')
                                      count+=1
                      if count!=expected:
                          raise SystemExit(f'{artifact_type} count changed during export: {count} != {expected}')
                      digest=hashlib.sha256(); size=0
                      with path.open('rb') as fh:
                          while chunk:=fh.read(1024*1024): digest.update(chunk); size+=len(chunk)
                      key=f"{prefix}/archive_run={target}.jsonl.gz"
                      s3.upload_file(str(path),bucket,key,ExtraArgs={'ContentType':'application/x-ndjson','ContentEncoding':'gzip','Metadata':{'sha256':digest.hexdigest()}})
                      head=s3.head_object(Bucket=bucket,Key=key)
                      if int(head.get('ContentLength',-1))!=size: raise SystemExit(f'S3 size verification failed: {key}')
                      uri=f's3://{bucket}/{key}'
                      conn.execute("""
                        insert into internal.prediction_artifacts
                          (artifact_type,training_run_id,model_version_id,object_uri,sha256,byte_size,row_count,content_type,compression,metadata)
                        values (%s,%s,%s,%s,%s,%s,%s,'application/x-ndjson','gzip',%s)
                        on conflict (artifact_type,training_run_id,model_version_id,sha256) do update set object_uri=excluded.object_uri,byte_size=excluded.byte_size,row_count=excluded.row_count,metadata=excluded.metadata
                      """,(artifact_type,run['training_run_id'],run['model_version_id'],uri,digest.hexdigest(),size,count,json.dumps({'storage':'s3','verified':True,'format':'ndjson-gzip','source_table':artifact_type})))
                      conn.commit()
                      if artifact_type=='RATING_CHECKPOINTS':
                          deleted=conn.execute('delete from internal.prediction_rating_checkpoints where model_version_id=%s',(run['model_version_id'],)).rowcount
                      else:
                          deleted=conn.execute('delete from internal.prediction_oos_benchmark where training_run_id=%s',(run['training_run_id'],)).rowcount
                      conn.commit()
                      if deleted!=expected: raise SystemExit(f'deleted {deleted} != {expected} for {artifact_type}')
                      artifacts.append({'artifact_type':artifact_type,'row_count':count,'deleted_rows':deleted,'uri':uri,'sha256':digest.hexdigest(),'byte_size':size})
              conn.execute("update internal.prediction_training_runs set metrics=coalesce(metrics,'{}'::jsonb)||%s::jsonb where id=%s",(json.dumps({'artifact_archive':{'storage':'S3','verified':True,'artifacts':artifacts}}),target))
              conn.commit()
              final=conn.execute("""select pg_size_pretty(pg_database_size(current_database())) as db_size,(select count(*) from internal.prediction_rating_checkpoints) as rating_rows,(select count(*) from internal.prediction_oos_benchmark) as oos_rows,(select count(*) from internal.prediction_artifacts) as artifact_rows""").fetchone()
              print({'target_run':target,'artifacts':artifacts,'final':dict(final)})
              if int(final['rating_rows'])!=0 or int(final['oos_rows'])!=0:
                  raise SystemExit('transient prediction artifact rows remain')
          PY
