# Fresh historical benchmark verification trigger after the psycopg SQL placeholder fix.
# Manual re-run trigger marker: 2026-08-29T13:18Z
name: Zahrly P0 Prediction Training Validation

on:
  push:
    branches: [p0-prediction-engine-foundation]
  pull_request:
    types: [synchronize]
    branches: [p0-prediction-engine-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zahrly-p0-training-validation
  cancel-in-progress: false

jobs:
  walk-forward:
    name: Historical S3 walk-forward validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_PROJECT_REF: qosvqlwkexrhswcuakib
      SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
      SUPABASE_POOLER_PORT: "5432"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      S3_ENDPOINT_URL: https://s3.eu-north-1.amazonaws.com
      S3_REGION: eu-north-1
      S3_BUCKET: zahrly-community-storage
      S3_PREFIX: ${{ secrets.S3_PREFIX }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate secrets and normalize PostgreSQL URL
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do test -n "${!v}" || { echo "missing GitHub secret: $v"; exit 1; }; done
          if [ -z "${S3_PREFIX:-}" ]; then echo "S3_PREFIX=zahrly/archive" >> "$GITHUB_ENV"; fi
          python - <<'PY'
          import os
          from urllib.parse import quote, unquote, urlsplit, urlunsplit
          raw=os.environ['SUPABASE_DB_URL'].strip(); p=urlsplit(raw)
          if p.scheme not in {'postgres','postgresql'} or not p.hostname or p.password is None: raise SystemExit('invalid SUPABASE_DB_URL')
          host=p.hostname.lower().rstrip('.'); user=unquote(p.username or 'postgres'); password=quote(unquote(p.password),safe=''); project=os.environ['SUPABASE_PROJECT_REF']
          if host.endswith('.pooler.supabase.com'):
              selected_host=host; selected_port=p.port or int(os.environ['SUPABASE_POOLER_PORT'])
              if '.' not in user: user=f'postgres.{project}'
          elif host == f'db.{project}.supabase.co':
              selected_host=os.environ['SUPABASE_POOLER_HOST']; selected_port=int(os.environ['SUPABASE_POOLER_PORT'])
              if user == 'postgres': user=f'postgres.{project}'
          else: raise SystemExit(f'unsupported Supabase host: {host}')
          query=p.query or ''
          if 'sslmode=' not in query: query=(query+'&' if query else '')+'sslmode=require'
          normalized=urlunsplit(('postgresql',f'{quote(user,safe="")}:{password}@{selected_host}:{selected_port}',p.path or '/postgres',query,''))
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'SUPABASE_DB_URL={normalized}\n')
          PY
      - name: Install prediction-engine dependencies
        run: python -m pip install --upgrade pip && pip install -r workers/archive_worker/requirements.txt
      - name: Run historical walk-forward validation and publish SHADOW artifact
        run: python -m workers.prediction_engine.historical_training_job
      - name: Build fixed historical OOS benchmark dataset
        run: python -m workers.prediction_engine.oos_benchmark
      - name: Reconcile persisted training state and enforce promotion gates
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['SUPABASE_DB_URL']) as conn:
            with conn.cursor() as cur:
              cur.execute("""
                select ptr.id::text, ptr.status, ptr.metrics, ptr.model_version_id::text,
                       mv.status as model_status, mv.artifact_uri
                from internal.prediction_training_runs ptr
                join public.model_versions mv on mv.id=ptr.model_version_id
                order by ptr.started_at desc limit 1
              """)
              latest=cur.fetchone()
              cur.execute("select count(*) from internal.prediction_oos_benchmark where training_run_id=(select id from internal.prediction_training_runs order by started_at desc limit 1)")
              benchmark_rows=cur.fetchone()[0]
              cur.execute("select count(*) from internal.archive_catalog where dataset_type='fixtures' and provider='api-football' and completeness_score>=1 and object_uri like 's3://%'")
              manifests=cur.fetchone()[0]
          if not latest: raise SystemExit('training persistence gate failed: no training run')
          run_id,run_status,metrics,model_id,model_status,artifact_uri=latest
          metrics=metrics or {}; validation_status=metrics.get('validation_status','UNKNOWN'); validation_eligible=bool(metrics.get('validation_eligible',False)); promotion_blocked=bool(metrics.get('promotion_blocked',True))
          benchmark=metrics.get('benchmark') or {}; model=benchmark.get('model') or {}; empirical=benchmark.get('empirical_baseline') or {}; market=benchmark.get('market') or {}
          print(f'latest_training_run={run_id}')
          print(f'latest_training_status={run_status}')
          print(f'latest_model_version={model_id}')
          print(f'latest_model_status={model_status}')
          print(f'latest_artifact_uri={artifact_uri}')
          print(f'validation_status={validation_status}')
          print(f'validation_eligible={validation_eligible}')
          print(f'promotion_blocked={promotion_blocked}')
          print(f'eligible_fixture_manifests={manifests}')
          print(f'benchmark_rows={benchmark_rows}')
          print(f'model_brier={model.get("brier")}')
          print(f'empirical_brier={empirical.get("brier")}')
          print(f'market_rows={market.get("n",0)}')
          print(f'market_brier={market.get("brier")}')
          if run_status!='SUCCEEDED': raise SystemExit('training persistence gate failed: latest run not succeeded')
          if str(model_status).upper()!='SHADOW' or not artifact_uri: raise SystemExit('training persistence gate failed: latest model is not SHADOW with artifact')
          if manifests<=0: raise SystemExit('training persistence gate failed: no eligible archive manifests')
          if benchmark_rows<=0: raise SystemExit('benchmark gate failed: no fixed OOS benchmark rows')
          if not validation_eligible and validation_status!='INSUFFICIENT_HISTORY': raise SystemExit('training persistence gate failed: unexpected validation state')
          if validation_eligible and promotion_blocked: raise SystemExit('training persistence gate failed: eligible candidate still blocked')
          print('promotion_gate=BLOCKED unless validation_eligible=true')
          print('benchmark_thresholds: brier>=3%, log_loss>=2%, rps>=2%, ece regression<=0.01, seasons>=3, oos>=3000')
          PY
