name: provider-worker-ci

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/provider-quota-gateway.yml'
      - 'workers/provider_gateway/**'
      - 'docker/Dockerfile.runtime'
      - 'providers/api-football/**'

permissions:
  contents: read

env:
  PROVIDER_QUOTA_GATEWAY_URL: https://qosvqlwkexrhswcuakib.supabase.co/functions/v1/provider-quota-persistence-v5
  PROVIDER_FIXTURE_PERSISTENCE_URL: https://qosvqlwkexrhswcuakib.supabase.co/functions/v1/provider-fixture-persistence
  PROVIDER_REGISTRY_GATEWAY_URL: https://qosvqlwkexrhswcuakib.supabase.co/functions/v1/provider-registry-persistence

jobs:
  provider-worker-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build provider worker image
        run: docker build -f docker/Dockerfile.runtime -t zahrly-provider-worker:ci .

      - name: Run real API-Football provider adapter and persistence boundary
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PROVIDER_GATEWAY_SECRET: ${{ secrets.PROVIDER_GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          API_FOOTBALL_KEY="$(printf '%s' "${API_FOOTBALL_KEY}" | tr -d '\r\n')"
          PROVIDER_GATEWAY_SECRET="$(printf '%s' "${PROVIDER_GATEWAY_SECRET}" | tr -d '\r\n')"
          export API_FOOTBALL_KEY PROVIDER_GATEWAY_SECRET
          test -n "${API_FOOTBALL_KEY}"
          test -n "${PROVIDER_GATEWAY_SECRET}"
          docker run --rm \
            -e API_FOOTBALL_KEY \
            -e PROVIDER_GATEWAY_SECRET \
            -e PROVIDER_QUOTA_GATEWAY_URL \
            zahrly-provider-worker:ci \
            python -m workers.provider_gateway.worker > quota_snapshot.json
          cat quota_snapshot.json

      - name: Validate live provider observation and persistence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('quota_snapshot.json').read_text(encoding='utf-8'))
          snapshot = result.get('snapshot', {})
          persistence = result.get('persistence', {})
          required = {'provider', 'observed_at', 'daily_budget', 'quota_used', 'quota_remaining', 'provider_status_ok'}
          missing = sorted(required.difference(snapshot))
          if missing:
              raise SystemExit(f'missing snapshot fields: {missing}')
          if snapshot['provider'] != 'api-football':
              raise SystemExit('unexpected provider')
          if not snapshot['provider_status_ok']:
              raise SystemExit('provider status is not healthy')
          if snapshot['daily_budget'] < 0 or snapshot['quota_used'] < 0 or snapshot['quota_remaining'] < 0:
              raise SystemExit('quota values must be non-negative')
          if snapshot['quota_used'] > snapshot['daily_budget']:
              raise SystemExit('quota_used exceeds daily_budget')
          if snapshot['quota_remaining'] > snapshot['daily_budget']:
              raise SystemExit('quota_remaining exceeds daily_budget')
          if abs((snapshot['quota_used'] + snapshot['quota_remaining']) - snapshot['daily_budget']) > 1e-9:
              raise SystemExit('quota invariant failed')
          if persistence.get('persisted') is not True:
              raise SystemExit(f'quota snapshot was not persisted: {persistence}')
          print('provider worker + private Supabase persistence: PASS')
          PY

      - name: Register real API-Football leagues and seasons 2000-2026
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PROVIDER_GATEWAY_SECRET: ${{ secrets.PROVIDER_GATEWAY_SECRET }}
          PROVIDER_REGISTRY_GATEWAY_URL: ${{ env.PROVIDER_REGISTRY_GATEWAY_URL }}
          SEASON_START: '2000'
          SEASON_END: '2026'
        run: |
          set -euo pipefail
          API_FOOTBALL_KEY="$(printf '%s' "${API_FOOTBALL_KEY}" | tr -d '\r\n')"
          PROVIDER_GATEWAY_SECRET="$(printf '%s' "${PROVIDER_GATEWAY_SECRET}" | tr -d '\r\n')"
          export API_FOOTBALL_KEY PROVIDER_GATEWAY_SECRET
          test -n "${API_FOOTBALL_KEY}"
          test -n "${PROVIDER_GATEWAY_SECRET}"
          docker run --rm \
            -e API_FOOTBALL_KEY \
            -e PROVIDER_GATEWAY_SECRET \
            -e PROVIDER_REGISTRY_GATEWAY_URL \
            -e SEASON_START \
            -e SEASON_END \
            zahrly-provider-worker:ci \
            python -m workers.provider_gateway.registry_bootstrap > registry_bootstrap.json
          cat registry_bootstrap.json

      - name: Validate real season registry bootstrap
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('registry_bootstrap.json').read_text(encoding='utf-8'))
          if result.get('provider') != 'api-football':
              raise SystemExit(f'unexpected provider: {result}')
          if result.get('season_range') != [2000, 2026]:
              raise SystemExit(f'unexpected season range: {result}')
          if result.get('available_seasons', 0) <= 0:
              raise SystemExit('API-Football returned no available seasons in the requested range')
          if result.get('registered_zahrly_competitions', 0) <= 0:
              raise SystemExit('no Zahrly competitions are mapped to API-Football')
          if result.get('persisted_registrations', 0) <= 0:
              raise SystemExit(f'no provider season registrations were persisted: {result}')
          print('real API-Football league/season registry: PASS')
          print(f"available_seasons={result['available_seasons']}")
          print(f"matched_league_season_pairs={result['matched_league_season_pairs']}")
          print(f"persisted_registrations={result['persisted_registrations']}")
          PY

      - name: Ingest first canonical API-Football fixture
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PROVIDER_GATEWAY_SECRET: ${{ secrets.PROVIDER_GATEWAY_SECRET }}
          PROVIDER_FIXTURE_PERSISTENCE_URL: ${{ env.PROVIDER_FIXTURE_PERSISTENCE_URL }}
        run: |
          set -euo pipefail
          API_FOOTBALL_KEY="$(printf '%s' "${API_FOOTBALL_KEY}" | tr -d '\r\n')"
          PROVIDER_GATEWAY_SECRET="$(printf '%s' "${PROVIDER_GATEWAY_SECRET}" | tr -d '\r\n')"
          export API_FOOTBALL_KEY PROVIDER_GATEWAY_SECRET
          test -n "${API_FOOTBALL_KEY}"
          test -n "${PROVIDER_GATEWAY_SECRET}"
          python -m workers.provider_gateway.fixture_ingest > fixture_ingest.json
          cat fixture_ingest.json

      - name: Validate canonical fixture ingestion
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('fixture_ingest.json').read_text(encoding='utf-8'))
          if result.get('persisted') is not True:
              if result.get('reason') == 'no_upcoming_fixtures':
                  raise SystemExit('no upcoming fixture returned by API-Football for the selected ingestion date')
              raise SystemExit(f'fixture ingestion failed: {result}')
          rows = result.get('fixtures') or []
          if not rows:
              raise SystemExit('fixture ingestion reported success without a persisted fixture')
          for row in rows:
              for key in ('fixture_id', 'episode_id', 'provider_fixture_id'):
                  if not row.get(key):
                      raise SystemExit(f'missing canonical identifier: {key}')
          print('canonical API-Football fixture ingestion: PASS')
          PY

      - name: Upload provider worker integration artifact
        uses: actions/upload-artifact@v6
        with:
          name: api-football-provider-worker-${{ github.run_id }}
          path: |
            quota_snapshot.json
            registry_bootstrap.json
            fixture_ingest.json
