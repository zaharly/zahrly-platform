name: patch-rewards-admin
on:
  push:
    branches: [fix/rewards-pages-crud-v3]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RewardsAdminV2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/frontend/pages/rewards/RewardsAdminV2.tsx')
          s=p.read_text()
          s=s.replace("const err=(e:unknown)=>e instanceof Error?e.message:'Operation failed'", "const err=(e:unknown)=>{const x=e as any;if(x?.message)return [x.message,x.code?`(${x.code})`:'',x.details||'',x.hint?`Hint: ${x.hint}`:''].filter(Boolean).join(' ');return typeof e==='string'?e:'Operation failed'}")
          s=s.replace("async function status(r:any){const next=r.status==='active'?'paused':'active';", "async function removeBonus(id:string){if(!window.confirm('Delete this bonus?'))return;try{const refs=await Promise.all([supabase.from('challenge_prizes').select('id',{count:'exact',head:true}).eq('bonus_id',id),supabase.from('challenge_prize_codes').select('id',{count:'exact',head:true}).eq('bonus_id',id),supabase.from('user_bonus_grants').select('id',{count:'exact',head:true}).eq('bonus_id',id)]);const bad=refs.find(x=>x.error);if(bad?.error)throw bad.error;if(refs.some(x=>Number(x.count??0)>0))throw new Error('This bonus has prize/grant history. Archive it instead of deleting it.');const {error}=await supabase.from('bonuses').delete().eq('id',id);if(error)throw error;toast.success('Bonus deleted');await load()}catch(e){toast.error(err(e))}}\n async function status(r:any){const next=r.status==='active'?'paused':'active';")
          s=s.replace("<Button size=\"sm\" variant=\"ghost\" onClick={()=>void status(r)}>{r.status==='active'?'Pause':'Activate'}</Button></td></tr>", "<Button size=\"sm\" variant=\"ghost\" onClick={()=>void status(r)}>{r.status==='active'?'Pause':'Activate'}</Button><Button size=\"sm\" variant=\"ghost\" onClick={()=>void removeBonus(r.id)}><Trash2 className=\"h-3.5 w-3.5\"/></Button></td></tr>")
          s=s.replace("async function remove(table:string,rowId:string){if(!window.confirm('Delete this item?'))return;const {error}=await supabase.from(table).delete().eq('id',rowId);", "async function remove(table:string,rowId:string){if(!window.confirm('Delete this item?'))return;const {error}=await supabase.from(table).delete().eq('id',rowId);")
          s=s.replace("onClick={()=>void op('refresh_pickrush_contest_state',r.id)}", "onClick={()=>void load()}")
          s=s.replace("<Text label=\"Maximum total odds\" value={f.max_total_odds} onChange={v=>set('max_total_odds',v)} type=\"number\"/>", "<Text label=\"Maximum total odds\" value={f.max_total_odds} onChange={v=>set('max_total_odds',v)} type=\"number\" required/>")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/frontend/pages/rewards/RewardsAdminV2.tsx
          git diff --cached --quiet || git commit -m "fix(admin): repair rewards CRUD [skip ci]"
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/rewards-admin-fix.yml
          git commit -m "chore(admin): remove temporary patch workflow [skip ci]"
          git push