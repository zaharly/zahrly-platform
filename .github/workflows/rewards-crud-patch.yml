name: patch-rewards-crud
on:
  push:
    branches: [fix/rewards-pages-crud-v3]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing RewardsAdminV2 pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/frontend/pages/rewards/RewardsAdminV2.tsx')
          s=p.read_text()
          s=s.replace("async function op(fn:string,id:string){const {error}=await supabase.rpc(fn,{p_contest_id:id});if(error)toast.error(err(error));else{toast.success('Operation completed');await load()}}", "async function op(fn:string,id:string,extra:any={}){const {error}=await supabase.rpc(fn,{p_contest_id:id,...extra});if(error)toast.error(err(error));else{toast.success('Operation completed');await load()}}")
          s=s.replace("onClick={()=>void op('close_pickrush',r.id)}", "onClick={()=>void op('close_pickrush',r.id,{p_reason:'admin'})}")
          s=s.replace("async function op(fn:string,id:string,extra:any={}){const {error}=await supabase.rpc(fn,{p_contest_id:id,...extra});if(error)toast.error(err(error));else{toast.success('Operation completed');await load()}}return <div", "async function removeContest(id:string){if(!window.confirm('Delete this Pick Rush contest?'))return;const {error}=await supabase.from('pickrush_contests').delete().eq('id',id);if(error)toast.error(err(error));else{toast.success('Pick Rush deleted');await load()}}\\nasync function op(fn:string,id:string,extra:any={}){const {error}=await supabase.rpc(fn,{p_contest_id:id,...extra});if(error)toast.error(err(error));else{toast.success('Operation completed');await load()}}return <div")
          s=s.replace("<Button size=\"sm\" variant=\"ghost\" onClick={()=>void load()}><RefreshCw className=\"h-3.5 w-3.5\"/></Button></td></tr>", "<Button size=\"sm\" variant=\"ghost\" onClick={()=>void load()}><RefreshCw className=\"h-3.5 w-3.5\"/></Button><Button size=\"sm\" variant=\"ghost\" onClick={()=>void removeContest(r.id)}><Trash2 className=\"h-3.5 w-3.5\"/></Button></td></tr>")
          s=s.replace("useEffect(()=>{void load()},[]);return <div className=\"flex flex-col gap-density-lg\"><PageHeader title=\"Giveaways\"", "useEffect(()=>{void load()},[]);async function removeGiveaway(r:any){if(!window.confirm('Delete this giveaway?'))return;try{const checks=await Promise.all([supabase.from('challenge_entries').select('id',{count:'exact',head:true}).eq('challenge_id',r.challenge_id),supabase.from('challenge_tasks').select('id',{count:'exact',head:true}).eq('challenge_id',r.challenge_id),supabase.from('challenge_prizes').select('id',{count:'exact',head:true}).eq('challenge_id',r.challenge_id),supabase.from('challenge_winners').select('id',{count:'exact',head:true}).eq('challenge_id',r.challenge_id),supabase.from('pickrush_contests').select('id',{count:'exact',head:true}).eq('challenge_id',r.challenge_id),supabase.from('prize_pool_campaigns').select('id',{count:'exact',head:true}).eq('challenge_id',r.challenge_id)]);const bad=checks.find(x=>x.error);if(bad?.error)throw bad.error;if(checks.some(x=>Number(x.count??0)>0))throw new Error('This giveaway has participation/history. Set it to ended or cancelled instead of deleting it.');const {error}=await supabase.from('giveaways').delete().eq('id',r.id);if(error)throw error;const {error:ce}=await supabase.from('challenges').delete().eq('id',r.challenge_id);if(ce)throw ce;toast.success('Giveaway deleted');await load()}catch(e){toast.error(err(e))}};return <div className=\"flex flex-col gap-density-lg\"><PageHeader title=\"Giveaways\"")
          s=s.replace("<Button asChild size=\"sm\" variant=\"ghost\"><Link to={`/giveaways/${r.id}/edit`}>Manage</Link></Button></td></tr>", "<Button asChild size=\"sm\" variant=\"ghost\"><Link to={`/giveaways/${r.id}/edit`}>Manage</Link></Button><Button size=\"sm\" variant=\"ghost\" onClick={()=>void removeGiveaway(r)}><Trash2 className=\"h-3.5 w-3.5\"/></Button></td></tr>")
          s=s.replace("useEffect(()=>{void load()},[]);async function process(id:string){", "useEffect(()=>{void load()},[]);async function removeCampaign(id:string){if(!window.confirm('Delete this Prize Pool campaign?'))return;const {error}=await supabase.from('prize_pool_campaigns').delete().eq('id',id);if(error)toast.error(err(error));else{toast.success('Prize Pool deleted');await load()}}async function process(id:string){")
          s=s.replace("<Button size=\"sm\" variant=\"ghost\" onClick={()=>void process(r.id)}>Process</Button></td></tr>", "<Button size=\"sm\" variant=\"ghost\" onClick={()=>void process(r.id)}>Process</Button><Button size=\"sm\" variant=\"ghost\" onClick={()=>void removeCampaign(r.id)}><Trash2 className=\"h-3.5 w-3.5\"/></Button></td></tr>")
          s=s.replace("useEffect(()=>{void load()},[]);async function recompute(id?:string){", "useEffect(()=>{void load()},[]);async function removeBookmaker(id:string){if(!window.confirm('Delete this bookmaker?'))return;const {error}=await supabase.from('bookmakers_radar').delete().eq('id',id);if(error)toast.error(err(error));else{toast.success('Bookmaker deleted');await load()}}async function recompute(id?:string){")
          s=s.replace("<Button size=\"sm\" variant=\"ghost\" onClick={()=>void recompute(r.id)}>Recompute</Button>", "<Button size=\"sm\" variant=\"ghost\" onClick={()=>void recompute(r.id)}>Recompute</Button><Button size=\"sm\" variant=\"ghost\" onClick={()=>void removeBookmaker(r.id)}><Trash2 className=\"h-3.5 w-3.5\"/></Button>")
          s=s.replace("useEffect(()=>{void load();void loadLive()},[]);return <div className=\"flex flex-col gap-density-lg\"><PageHeader title=\"Leaderboards\"", "useEffect(()=>{void load();void loadLive()},[]);async function removeBot(id:string){if(!window.confirm('Delete this leaderboard bot?'))return;const {error}=await supabase.from('leaderboard_bots').delete().eq('id',id);if(error)toast.error(err(error));else{toast.success('Bot deleted');await load()}};return <div className=\"flex flex-col gap-density-lg\"><PageHeader title=\"Leaderboards\"")
          s=s.replace("<Button asChild size=\"sm\" variant=\"ghost\"><Link to={`/leaderboards/${r.id}/edit`}>Edit</Link></Button>", "<Button asChild size=\"sm\" variant=\"ghost\"><Link to={`/leaderboards/${r.id}/edit`}>Edit</Link></Button><Button size=\"sm\" variant=\"ghost\" onClick={()=>void removeBot(r.id)}><Trash2 className=\"h-3.5 w-3.5\"/></Button>")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/frontend/pages/rewards/RewardsAdminV2.tsx
          git diff --cached --quiet || git commit -m "fix(admin): complete rewards CRUD [skip ci]"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/rewards-crud-patch.yml
          git commit -m "chore(admin): remove rewards patch workflow [skip ci]"
          git push