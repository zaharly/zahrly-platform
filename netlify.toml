[build]
  command = "npm --prefix admin/frontend install --no-package-lock && npm --prefix admin/frontend run build"
  publish = "admin/frontend/dist"
  functions = "admin/netlify/functions"
  [build.environment]
    NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm --prefix admin/frontend install --no-package-lock && npm --prefix admin/frontend run build"
  publish = "admin/frontend/dist"

[context.deploy-preview]
  command = "npm --prefix admin/frontend install --no-package-lock && npm --prefix admin/frontend run build"
  publish = "admin/frontend/dist"
